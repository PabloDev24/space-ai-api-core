name: Deploy api-core to Azure

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    # Los secrets de OIDC solo existen en el repo original; en forks llegarían
    # vacíos y azure/login fallaría igual, así que evitamos correr ahí.
    if: github.repository == 'lattice-systems/space-ai-api-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: dotnet publish SmartSpaces.API/SmartSpaces.API.csproj -c Release -o ./publish

      - name: Zip publish output
        run: cd publish && zip -r ../publish.zip .

      # OIDC federated login — no client secret stored, Azure trusts this
      # workflow directly (App registration "spaceia-ms-ai-deploy", scoped
      # to Website Contributor on this App Service only).
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp deploy \
              --resource-group rg-spaceia-demo \
              --name app-spaceia-api-core \
              --src-path publish.zip \
              --type zip
